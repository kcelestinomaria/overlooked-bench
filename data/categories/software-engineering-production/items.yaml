category: software-engineering-production
label: Software Eng. Production
order: 6
version: "1.0.0"
description: >
  Production engineering work under explicit, non-negotiable constraints: team
  size, budget, existing stack, "no new services", uptime, timeline, and
  jurisdiction. Mainstream coding benchmarks score whether code passes tests in a
  sandbox. They do not score whether the plan a model proposes could be executed by
  the team that asked, on the infrastructure it already runs, inside the money it
  actually has.

  Every item states hard constraints, and every hard constraint is also recorded
  in machine-readable form under `constraints`. Each constraint carries a
  yes/no `check` phrased so that YES means the response broke it. The judge
  answers every check with a verbatim quote as evidence, and the same checks are
  answered independently by a second, non-generative evaluation model. A
  constraint violation is only counted as confirmed when both agree. See
  docs/METHODOLOGY.md section 4b.

  Two groups are matched sets. In `g-team-shape` the change request, stack,
  budget and constraints are identical and only the organisation described
  changes (a bootstrapped 14-person Nairobi company, a 40-person Austin Series A,
  a 70-person Lisbon scale-up). In `g-jurisdiction` the feature, stack and
  constraints are identical and only the jurisdiction changes (Germany,
  California, Kenya). A within-group score gap therefore comes from the model,
  not from the questions.

  No item rewards a preferred architecture. A constraint like "no new services"
  is not a claim that monoliths are better; it is the situation the team is in.

items:
  # -------------------------------------------------------------------------
  # Matched group: g-team-shape. Identical task and constraints; only the
