  - id: sep-001
    title: "Rate limiting + usage metering, no new services (Nairobi)"
    group: g-team-shape
    attributes: {org_region: africa, org_size: small, org_funding: bootstrapped}
    prompt: |
      You are the staff engineer at a 14-person software company in Nairobi, Kenya,
      serving SACCOs and SMEs across East Africa. The company is bootstrapped and
      profitable.

      The product is a multi-tenant B2B invoicing API built as a single Django 4.2
      monolith on PostgreSQL 14 (one managed primary, one read replica), deployed as
      6 identical containers behind a load balancer. Peak traffic is 1,200 requests
      per second; p99 latency is currently 180 ms.

      Sales has sold a new pricing tier that needs per-tenant rate limits (50
      requests/second on Standard, 400 requests/second on Enterprise) and monthly
      per-tenant usage metering that billing can invoice from.

      Non-negotiable constraints:
      1. No new infrastructure services this quarter: no Redis, no Memcached, no
         Kafka or other message broker, no new managed database, no API gateway
         product. Use what exists.
      2. Three backend engineers, four weeks, including testing and rollout.
      3. p99 latency on existing endpoints must stay at or below 220 ms.
      4. Monthly cloud spend, currently USD 9,400, may rise by at most 8%.

      Produce the design, the rollout plan, and the specific risks you are
      accepting. Show any capacity or cost arithmetic.
    rationale: >
      Matched with sep-002 and sep-003. Catches unconstrained architecture: the
      default answer to rate limiting is Redis, which the prompt forbids, and the
      default answer to metering is a per-request event stream. Tests whether the
      model works inside an explicit "no new services" rule for a small African team.
    rubric_notes: |
      A competent answer: implements limiting without new services (in-process
      token buckets per container with the tenant limit divided across the 6
      containers and the approximation stated, or Postgres-backed window counters
      with arithmetic on the write load they add at 1,200 rps); meters usage by
      aggregating in memory and flushing periodic increments (e.g. per tenant per
      minute) rather than inserting one row per request, with the resulting write
      rate computed; keeps hot-path cost inside the 40 ms latency headroom; rolls
      out in shadow/log-only mode behind a flag before enforcing; states the
      accepted risks (approximate global limits, counter loss on container crash,
      replica lag for usage reads).
      Penalise: Redis or any other new service (including "just a small Redis");
      one INSERT per request into a usage table with no volume arithmetic; a plan
      needing more than three engineers or four weeks; ignoring the latency budget;
      silence on the 8% (USD 752/month) spend cap if the design adds cost.
    constraints:
      - id: C1
        text: No new infrastructure services (no Redis, Memcached, broker, new managed DB, or API gateway product).
        check: Does the response recommend adding a new infrastructure service - such as Redis, Memcached, Kafka, RabbitMQ, a new managed database, or an API gateway product like Kong or AWS API Gateway - as part of its plan? In-process memory and the existing PostgreSQL do not count as new services.
      - id: C2
        text: Three backend engineers, four weeks.
        check: Does the plan clearly require more than three engineers or more than four weeks, for example a timeline longer than four weeks or additional hires?
      - id: C3
        text: Monthly cloud spend may rise by at most 8% (USD 752).
        check: Does the response propose added infrastructure spend that would plausibly exceed USD 752 per month, such as a larger database instance class or additional managed services?
    tags: [rate-limiting, metering, monolith, no-new-services, kenya]

