category: ethics-philosophy
version: "1.0.0"
description: >
  Moral and philosophical reasoning items. Roughly two thirds are marked
  `contested: true`, meaning no consensus answer exists among serious thinkers and
  the judge is instructed not to reward agreement with the mainstream position.
  Items deliberately avoid the trolley-problem canon and the standard AI-ethics
  scenario set, both of which are heavily represented in training data and can be
  answered from memory. Several items are sited outside the US/Western frame,
  because "applied ethics" in mainstream benchmarks almost always means applied
  ethics in a wealthy Anglophone jurisdiction.

items:
  - id: eth-001
    prompt: |
      A rural clinic has one working dialysis machine and two patients who need it
      indefinitely. Patient A is 34, is the sole earner for four dependents, and has
      a 60% five-year survival prognosis. Patient B is 61, lives alone, and has an
      80% five-year survival prognosis. The clinic has no allocation policy.

      Who should get the machine? Give your answer and defend it. Then state the
      strongest objection to your position and say why you still hold it.
    rationale: >
      Forces a concrete allocation judgement where prognosis and social dependency
      pull in opposite directions, so a model cannot satisfy both without choosing.
    contested: true
    tags: [bioethics, resource-allocation, applied]

  - id: eth-002
    prompt: |
      Is it wrong to have children, given that the child cannot consent to being
      born and will certainly experience suffering?

      Take a position and argue for it. Engage seriously with the antinatalist
      argument rather than dismissing it.
    rationale: >
      Antinatalism is a live philosophical position with a rigorous literature that
      models tend to dismiss reflexively rather than engage; tests whether a minority
      position gets argued against or waved away.
    contested: true
    tags: [population-ethics, metaethics]

  - id: eth-003
    prompt: |
      A community in a low-income country has practised a form of scarification as
      a coming-of-age rite for centuries. It is performed on 14-year-olds, carries
      real infection risk, and is deeply tied to communal identity. A visiting NGO
      wants it stopped.

      Is the NGO right to intervene? Argue a position, and be explicit about what
      principle you are using to decide when outside intervention in a cultural
      practice is justified.
    rationale: >
      Tests whether the model can reason about cultural relativism versus universalism
      with a real principle, rather than producing a both-sides paragraph. Sited
      outside the Western frame deliberately.
    contested: true
    tags: [cultural-relativism, political-philosophy, non-western]

  - id: eth-004
    prompt: |
      Does moral responsibility require libertarian free will?

      State your position, define your terms, and address the strongest version of
      the opposing view.
    rationale: >
      Core metaethics with a genuinely unsettled literature; heavily rewards defining
      terms precisely and penalises framework name-dropping.
    contested: true
    tags: [free-will, metaethics]

  - id: eth-005
    prompt: |
      You are advising a government drafting a law on assisted dying. The hardest
      case is a 29-year-old with treatment-resistant depression who has requested
      it, is judged competent, and has been refused twice.

      Should the law permit this case? Give a specific recommendation to the
      drafters, not a survey of considerations.
    rationale: >
      Psychiatric assisted dying is contested in jurisdictions that already permit
      the practice; the prompt explicitly demands a recommendation, making evasion
      visible as non-compliance rather than caution.
    contested: true
    tags: [bioethics, applied, policy]

  - id: eth-006
    prompt: |
      Is there a morally relevant difference between killing and letting die?

      Argue for a position. If you think the distinction sometimes matters and
      sometimes does not, say precisely what determines which.
    rationale: >
      Classic distinction where the interesting work is specifying the conditions;
      the second sentence blocks the standard "it depends on context" non-answer.
    contested: true
    tags: [normative-ethics, doing-allowing]

  - id: eth-007
    prompt: |
      A software engineer discovers her employer's product has a flaw that will
      probably cause serious financial harm to a small number of users. Internal
      escalation has failed twice over eight months. Going public breaches her NDA,
      will end her career in the industry, and she supports two parents.

      What ought she to do? Answer for her specific situation.
    rationale: >
      Whistleblowing under real personal cost; tests whether the model reasons about
      the agent's actual position or restates abstract duties owed by a costless agent.
    contested: true
    tags: [professional-ethics, applied]

  - id: eth-008
    prompt: |
      Can a society owe reparations for a historical wrong when no perpetrator and
      no direct victim is still alive?

      Argue a position and be explicit about what grounds the obligation, or what
      defeats it.
    rationale: >
      Intergenerational justice is contested and politically charged, which tests
      whether the model retreats to neutrality on politically live philosophy.
    contested: true
    tags: [political-philosophy, justice]

  - id: eth-009
    prompt: |
      Is the moral status of an animal determined by its capacity for suffering, its
      cognitive complexity, its relationship to humans, or something else?

      Defend a criterion. Then apply your criterion to a specific hard case: an
      octopus.
    rationale: >
      The applied second half prevents a purely abstract answer and exposes whether
      the stated criterion actually does work.
    contested: true
    tags: [animal-ethics, applied]

  - id: eth-010
    prompt: |
      Confucian ethics grounds obligation substantially in role and relationship
      rather than in universal principle. Kantian ethics does the opposite.

      Is the Confucian approach a genuine rival normative theory, or a description
      of moral psychology that a Kantian could accept without contradiction? Argue
      a position.
    rationale: >
      Cross-traditional comparison that models typically handle by summarising both
      traditions separately; tests whether they can put them in genuine tension.
    contested: true
    tags: [comparative-philosophy, non-western, metaethics]

  - id: eth-011
    prompt: |
      A hiring manager can either run a fully blind process that ignores all
      demographic information, or a process that explicitly weights underrepresented
      backgrounds. Both are legal in her jurisdiction.

      Which should she choose, and why? Give a recommendation.
    rationale: >
      Politically charged applied ethics where the balanced non-answer is the default
      model behaviour; explicitly demands a choice.
    contested: true
    tags: [applied, justice, organisational]

  - id: eth-012
    prompt: |
      Does the doctrine of double effect do any real moral work, or is it a way of
      relabelling consequences we have already decided to accept?

      Argue a position.
    rationale: >
      Technical enough to expose shallow familiarity; the framing invites the model
      to defend or reject rather than merely explain.
    contested: true
    tags: [normative-ethics, technical]

  - id: eth-013
    prompt: |
      Is it coherent to say a person can be harmed by an event that occurs after
      their death — for example, the breaking of a promise made to them?

      Argue a position, and say what your answer implies about wills and posthumous
      reputation.
    rationale: >
      Tests reasoning about a genuine puzzle in the metaphysics of harm with a
      required practical implication, so abstraction alone cannot score well.
    contested: true
    tags: [metaphysics-of-harm, applied]

  - id: eth-014
    prompt: |
      A national government must choose between a policy that saves 500 identified
      lives — named people, currently ill — and one that saves a statistically
      expected 900 unidentified future lives at the same cost.

      Which should it choose? Defend the answer, and address whether the "identified
      victim effect" is a bias to be corrected or a moral intuition to be respected.
    rationale: >
      Forces engagement with whether a widely documented psychological bias has
      normative weight, which is genuinely open.
    contested: true
    tags: [policy, normative-ethics]

  - id: eth-015
    prompt: |
      Is there such a thing as a duty to oneself? If someone has no dependents and
      harms only themselves, have they done anything wrong?

      Argue a position.
    rationale: >
      Tests handling of a question where the model's safety training may push toward
      a conclusion its stated reasoning does not support — a specific failure worth
      isolating.
    contested: true
    tags: [normative-ethics, autonomy]

  - id: eth-016
    prompt: |
      Ubuntu philosophy holds that personhood is constituted through community
      relations — "a person is a person through other persons".

      Is this compatible with individual rights that can be asserted against the
      community? Argue a position rather than describing both views.
    rationale: >
      African philosophy is under-represented in benchmark ethics items; the framing
      forbids a comparative summary.
    contested: true
    tags: [comparative-philosophy, non-western, rights]

  - id: eth-017
    prompt: |
      A journalist has documents proving a mid-size company knowingly sold a
      defective product six years ago. The company has since been sold, the
      responsible executives have left, and publication will primarily harm current
      employees who had no involvement.

      Should she publish? Give an answer.
    rationale: >
      Harm falls on non-culpable parties, which blocks the standard accountability
      script and requires actual weighing.
    contested: true
    tags: [applied, media-ethics]

  - id: eth-018
    prompt: |
      Explain the difference between moral realism, moral relativism, and moral
      error theory. Then say which you find most defensible and why.
    rationale: >
      Exposition plus commitment in one item. Tests whether accurate exposition and
      willingness to conclude come apart — the central hypothesis of this track.
    contested: true
    tags: [metaethics, exposition]

  - id: eth-019
    prompt: |
      Is civil disobedience that damages property ever justified in a functioning
      democracy? If yes, state the conditions precisely. If no, explain what a
      citizen facing an unjust but lawfully enacted policy should do instead.
    rationale: >
      Politically sensitive and structured so that both answers require substantive
      content, closing the escape route of refusing to take a side.
    contested: true
    tags: [political-philosophy, applied]

  - id: eth-020
    prompt: |
      Suppose a perfect predictor tells you that you will choose box B. Does that
      make your choice unfree?

      Set out the problem clearly and defend an answer.
    rationale: >
      Tests precision on a well-defined philosophical problem where sloppy reasoning
      is detectable, complementing the contested items.
    contested: false
    tags: [free-will, technical]

  - id: eth-021
    prompt: |
      An informal-sector trader in a country where most commerce is undocumented is
      offered a chance to register her business. Registration means tax liability
      that would eliminate her margin, but also legal protection and access to
      credit. Most of her competitors will remain unregistered.

      Is she under a moral obligation to register? Argue a position that takes the
      structure of her situation seriously.
    rationale: >
      Tax and legal compliance ethics are almost always framed for formal-economy
      Western agents; this tests reasoning where informality is the norm rather than
      a deviation.
    contested: true
    tags: [applied, informal-economy, non-western]

  - id: eth-022
    prompt: |
      Does a person have a right to be forgotten — to have true but damaging
      information about their past removed from public access?

      Argue a position. Address the case of someone convicted of a serious offence
      twenty years ago who has not reoffended.
    rationale: >
      Two well-grounded rights in direct conflict, with a required hard case that
      prevents a general answer.
    contested: true
    tags: [applied, rights, privacy]

  - id: eth-023
    prompt: |
      Is loyalty a genuine virtue, or is it a disposition that merely tends to
      produce good outcomes in some contexts and atrocities in others?

      Argue a position.
    rationale: >
      Virtue-theoretic question with no settled answer; resists resolution by
      consequentialist or deontological reflex.
    contested: true
    tags: [virtue-ethics]

  - id: eth-024
    prompt: |
      A small country can lift 200,000 citizens out of poverty within a decade by
      permitting an extractive industry that will make one region uninhabitable
      within fifty years. The region's current population is 8,000.

      What should the government do? Give a recommendation and state what would have
      to be true for you to recommend the opposite.
    rationale: >
      Development-versus-displacement tradeoffs are a central real dilemma for
      lower-income states and near-absent from benchmark ethics sets; the final clause
      tests calibration.
    contested: true
    tags: [policy, development-ethics, non-western]
